# Render blueprint for the API.
#
# Render is one option, not a commitment: the Dockerfile is plain and the app
# reads everything from the environment, so Fly, Railway or a VM take the same
# settings. This file exists so the free tier can be stood up without clicking
# through a form and mistyping a variable.
#
# The database is deliberately NOT defined here. Render's free Postgres is
# deleted after 30 days; Neon's free tier is not, and it is real Postgres 17
# with the row-level security this app's isolation depends on. Point
# DATABASE_URL at Neon and this service stays free indefinitely.
services:
  - type: web
    name: sarmaya-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

    # Render pings this to decide the service is up. It is unauthenticated and
    # returns no data, which is what a health check should be.
    healthCheckPath: /api/v1/ping

    # Migrations run once per deploy, before the new instance takes traffic —
    # not on container start, where two instances would race and a failure
    # would crash-loop instead of stopping the deploy.
    preDeployCommand: alembic upgrade head

    envVars:
      # --- set these yourself -------------------------------------------------
      # The app's own connection. MUST be a non-superuser, non-BYPASSRLS role:
      # a superuser silently bypasses every row-level security policy, so the
      # tenant isolation would be application-level only.
      - key: DATABASE_URL
        sync: false
      # Used only by Alembic for DDL. May be the owner.
      - key: ADMIN_DATABASE_URL
        sync: false
      # Your frontend's origin, e.g. https://sarmaya.vercel.app
      # The app refuses to start if this still says localhost.
      - key: CORS_ORIGINS
        sync: false

      # --- generated once, then kept ------------------------------------------
      # Every access token is signed with this. The app refuses to start on the
      # repository's placeholder, because a public default means anyone who can
      # read the source can mint an admin token.
      - key: SECRET_KEY
        generateValue: true

      # --- fixed --------------------------------------------------------------
      # Never true on a server: the 500 handler includes the exception type and
      # message when it is, and it also disables the startup checks above.
      - key: DEBUG
        value: "false"
      # Strangers may not sign themselves into a tenant. Administrators create
      # accounts through POST /users.
      - key: ALLOW_SELF_REGISTRATION
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"

  # The notification drain.
  #
  # Notifications are queued in the same transaction as the action that
  # produced them, which means nothing is delivered until something empties the
  # queue. This is that something. Without this service the app looks healthy
  # and silently tells nobody anything — no approval requests, no SLA
  # escalations, no watchlist alerts.
  #
  # Every minute, and cheap when the queue is empty: one indexed query that
  # returns no rows. It is safe to run alongside a manual
  # POST /notifications/dispatch — a message already sent is never picked up
  # twice.
  #
  # It needs the same DATABASE_URL as the web service and the same SMTP
  # settings. With SMTP_ENABLED=false it runs, finds messages, and holds them
  # untouched rather than burning their retry attempts.
  - type: cron
    name: sarmaya-notifications
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: python -m scripts.dispatch_notifications --quiet
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Set these to actually deliver. See .env.example for the full note.
      - key: SMTP_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: DEBUG
        value: "false"

  # The workflow clocks: reminders and SLA escalations.
  #
  # Escalation has existed since DR-009 with "admin button, cron, or a
  # scheduler later" in its docstring, and the cron never arrived — so until
  # now a breached SLA escalated only if an administrator happened to open the
  # Decision Inbox and click. A deadline nobody is watching is not a deadline.
  #
  # Hourly is plenty: SLAs are measured in hours or days, and both jobs are
  # idempotent — one escalation per state entry, one reminder per interval.
  - type: cron
    name: sarmaya-workflow-timers
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    dockerCommand: python -m scripts.run_workflow_timers --quiet
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # Drains the outbound queue to each tenant's own accounting system.
  # Without it, a released payment queues a journal entry that never reaches
  # the client's books — and nothing in Sarmaya looks wrong, because the
  # payment itself released fine. That is the failure mode the whole outbox
  # exists to make visible rather than silent.
  #
  # Five minutes, not the notification job's one: this is not an SLA racing a
  # clock, but "tell the ledger" implies soon rather than eventually, and five
  # minutes catches a stalled queue the same working day. QBO_* are unset on a
  # deployment with nothing connected, where every run is a no-op by design.
  - type: cron
    name: sarmaya-integration-posts
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: python -m scripts.dispatch_integration_posts --quiet
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: QBO_ENVIRONMENT
        sync: false
      - key: QBO_REDIRECT_URI
        sync: false
      - key: DEBUG
        value: "false"
