# Alembic Configuration File
# This file contains the configuration settings for Alembic migrations

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time:
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# Leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field of the filename (template 1 and 2)
# You might want to increase this if you have very long branch
# names or project names
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_options =

# set to 'true' to search source files recursively
# in each "version" location
# new in Alembic version 1.10
# include_object = 

# set to 'true' to compare type and server-side default/check
# instead of not rendering a modification that has the same
# value of mutable attributes. By default alembic will assume
# that equivalent values of different types (i.e. a string
# value in the defaults eq a numeric 1) are equivalent for the
# purpose of generating migrations.
# sqlalchemy_compare_type = false

# compare server default, in order to detect if the server
# default value has changed on existing columns
# sqlalchemy_compare_server_default=false

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
