version: 2

# Nothing here updates anything on its own: Dependabot opens a pull request and
# CI decides. That is the whole value of having added CI first — a dependency
# bump is exactly the change where "the suite still passes" is the only thing
# anybody actually wants to know, and until there was a suite running on every
# PR, an automated bump would have been a liability rather than a help.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # requirements.txt pins wide ranges (see the note at the top of it), so a
    # fresh install six months from now already resolves different transitive
    # versions with no record of what changed. Grouping the routine bumps into
    # one PR keeps that visible without producing a dozen to review.
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # The workflow's own actions pin to major versions (checkout@v4 and friends),
  # which float. Worth tracking for the same reason as anything else that runs
  # with access to the repository.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
